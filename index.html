<style>
  :root{
    --cover:#1E3D2E;
    --cover-dark:#122922;
    --cover-light:#2B4F3B;
    --paper:#EDE6D2;
    --paper-light:#F6F1E1;
    --ink:#241F17;
    --ink-soft:#6B6151;
    --rule:#CBBF9E;
    --brass:#A6822E;
    --brass-light:#C9A44C;
    --income:#2F6B4E;
    --income-soft:#DCE9DF;
    --expense:#9C3B2E;
    --expense-soft:#F1DED8;
    --shadow: 0 12px 30px -14px rgba(18,41,34,0.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:
      radial-gradient(circle at 15% 10%, var(--cover-light) 0%, transparent 45%),
      linear-gradient(160deg, var(--cover) 0%, var(--cover-dark) 100%);
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:960px;margin:0 auto;}
  .masthead{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding:6px 8px 22px;color:var(--paper-light);
    flex-wrap:wrap;gap:14px;
  }
  .masthead h1{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;font-weight:700;font-size:34px;margin:0;
    letter-spacing:0.3px;
  }
  .masthead .sub{
    font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--brass-light);
    margin-top:4px;font-weight:600;
  }
  .sync-badge{
    display:inline-block;margin-top:8px;font-size:11px;font-weight:600;
    padding:3px 10px;border-radius:20px;background:rgba(255,255,255,0.08);color:var(--paper-light);
  }
  .sync-badge.connected{background:rgba(63,107,79,0.35);}
  .sync-badge.error{background:rgba(156,59,46,0.4);}
  .sync-badge.syncing{opacity:0.75;}
  .stamp{
    width:112px;height:112px;border-radius:50%;
    border:3px solid var(--brass-light);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-6deg);
    color:var(--brass-light);
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    flex-shrink:0;
    background:rgba(255,255,255,0.03);
    position:relative;
  }
  .stamp::before{
    content:'';position:absolute;inset:6px;border:1px dashed var(--brass-light);border-radius:50%;opacity:0.5;
  }
  .stamp .lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;opacity:0.85;}
  .stamp .lbl2{font-size:8.5px;letter-spacing:1px;text-transform:uppercase;opacity:0.7;margin-top:1px;}
  .stamp .val{font-size:17px;font-weight:700;margin-top:3px;}
  .stamp.neg{border-color:#D98B7B;color:#D98B7B;}
  .stamp.neg::before{border-color:#D98B7B;}
  .tabs{display:flex;gap:6px;padding:0 8px;flex-wrap:wrap;}
  .tab-btn{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;font-weight:600;font-size:13.5px;
    padding:10px 18px 12px;border:none;cursor:pointer;
    background:var(--cover-light);color:var(--paper-light);opacity:0.65;
    border-radius:8px 8px 0 0;
    transition:all .15s ease;
  }
  .tab-btn:hover{opacity:0.9;}
  .tab-btn.active{
    background:var(--paper);color:var(--ink);opacity:1;
  }
  .sheet{
    background:var(--paper);border-radius:4px 14px 14px 14px;
    box-shadow:var(--shadow);
    padding:26px 24px 30px;
  }
  h2.section-title{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;font-size:20px;margin:0 0 4px;color:var(--ink);
    display:flex;align-items:center;gap:10px;
  }
  .section-title .n{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass);
    border:1px solid var(--brass);border-radius:20px;padding:2px 8px;
  }
  .section-desc{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;}
  @media(max-width:640px){.grid3{grid-template-columns:1fr;}}
  .card{
    background:var(--paper-light);border:1px solid var(--rule);border-radius:10px;
    padding:14px 16px;
  }
  .card .k{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);font-weight:600;}
  .card .v{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;margin-top:4px;}
  .card.income .v{color:var(--income);}
  .card.expense .v{color:var(--expense);}
  .card.saldo .v.pos{color:var(--income);}
  .card.saldo .v.neg{color:var(--expense);}
  .rowbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  select, input[type=date], input[type=text], input[type=number]{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;font-size:13.5px;
    border:1px solid var(--rule);background:var(--paper-light);color:var(--ink);
    border-radius:7px;padding:8px 10px;width:100%;min-width:0;
  }
  select:focus, input:focus{outline:2px solid var(--brass-light);outline-offset:1px;}
  label.small{font-size:11.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.6px;
    color:var(--ink-soft);padding:6px 8px;border-bottom:2px solid var(--ink);font-weight:700;
  }
  td{padding:8px 8px;border-bottom:1px solid var(--rule);vertical-align:middle;}
  tr:last-child td{border-bottom:1px solid var(--rule);}
  td.num, th.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
  td.cat-cell{white-space:nowrap;}
  .amt-in{color:var(--income);}
  .amt-out{color:var(--expense);}
  .badge{
    display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;
    text-transform:uppercase;letter-spacing:0.4px;
  }
  .badge.in{background:var(--income-soft);color:var(--income);}
  .badge.out{background:var(--expense-soft);color:var(--expense);}
  .badge.src{background:#E7E1CC;color:var(--ink-soft);}
  .icon-btn{
    background:none;border:1px solid var(--rule);border-radius:6px;cursor:pointer;
    font-size:12px;padding:4px 8px;color:var(--ink-soft);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  }
  .icon-btn:hover{background:var(--paper-light);color:var(--ink);}
  .icon-btn.danger:hover{border-color:var(--expense);color:var(--expense);}
  .icon-btn.primary{background:var(--cover);color:var(--paper-light);border-color:var(--cover);}
  .icon-btn.primary:hover{background:var(--cover-light);}
  .form-card{
    background:var(--paper-light);border:1px dashed var(--brass);border-radius:10px;
    padding:16px;margin-bottom:22px;
  }
  .form-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;}
  @media(max-width:900px){.form-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
  @media(max-width:640px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
  .form-field{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .form-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .chips{display:flex;gap:4px;flex-wrap:wrap;}
  .chip{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 7px;border-radius:5px;
    border:1px solid var(--rule);cursor:pointer;background:var(--paper-light);color:var(--ink-soft);
  }
  .chip.on{background:var(--brass);border-color:var(--brass);color:#fff;}
  .chart-svg{width:100%;height:auto;overflow:visible;}
  .chart-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;fill:var(--ink-soft);}
  .chart-axis{font-family:'IBM Plex Mono',monospace;font-size:8.5px;fill:var(--ink-soft);}
  .chart-grid{stroke:var(--rule);stroke-width:1;}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .dot.in{background:var(--income);} .dot.out{background:var(--expense);}
  .group-block{margin-bottom:26px;}
  .group-block h3{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;font-size:15.5px;margin:0 0 2px;color:var(--cover);
    border-bottom:1px solid var(--rule);padding-bottom:6px;
  }
  .group-total{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);float:right;font-weight:600;}
  .date-in{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:5px 6px;
    border:1px solid transparent;background:transparent;color:var(--ink);border-radius:6px;width:132px;
  }

/* ---------- State ---------- */
let DATA = null;
let dragRecKey = null;
let state = {
  tab: 'dashboard',
  selMonth: new Date().getMonth()+1,
  selYear: new Date().getFullYear(),
  showAllTxn: false,
  editTxnId: null,
  editRecId: null,
  editKrId: null,
  editSonId: null,
  addingRecGroup: null,
  addingKr: null,
  addingSon: false,
  resetConfirm: false
};
/* ---------- Storage ---------- */
const hasCloudStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';
const SYNC_CONFIG_KEY = 'haushaltsbuch-sync-config';
let syncConfig = null;          // {dbUrl, syncKey} — nur relevant außerhalb des Chats
let syncStatus = 'none';        // 'none' | 'syncing' | 'connected' | 'error'
let syncErrorMsg = '';
let syncPollTimer = null;

function ensureShape(){
  if(!DATA.paidMarks) DATA.paidMarks = {};
  if(!DATA.dateOverrides) DATA.dateOverrides = {};
  if(!DATA.updatedAt) DATA.updatedAt = 0;
  DATA.recurring.forEach(r=>{
    if(PAYMENT_SLUG_MIGRATION[r.paymentMethod]) r.paymentMethod = PAYMENT_SLUG_MIGRATION[r.paymentMethod];
    if(!Array.isArray(r.months)) r.months = [];
  });
  DATA.transactions.forEach(t=>{ if(PAYMENT_SLUG_MIGRATION[t.paymentMethod]) t.paymentMethod = PAYMENT_SLUG_MIGRATION[t.paymentMethod]; });
}
function isEditingSomething(){
  return !!(state.editTxnId || state.editRecId || state.editKrId || state.editSonId || state.addingRecGroup || state.addingKr || state.addingSon);
}

/* -- lokaler Sync-Konfig (Gerätespeicher, unabhängig von den Budgetdaten) -- */
function loadSyncConfig(){
  try{ const raw = localStorage.getItem(SYNC_CONFIG_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function saveSyncConfigLocal(cfg){ try{ localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(cfg)); }catch(e){} }
function clearSyncConfigLocal(){ try{ localStorage.removeItem(SYNC_CONFIG_KEY); }catch(e){} }

/* -- Firebase Realtime Database via REST (keine SDK nötig) -- */
function firebasePath(){
  if(!syncConfig || !syncConfig.dbUrl || !syncConfig.syncKey) return null;
  const base = syncConfig.dbUrl.trim().replace(/\/$/,'');
  return `${base}/haushaltsbuch/${encodeURIComponent(syncConfig.syncKey.trim())}.json`;
}
async function firebaseGet(){
  const url = firebasePath();
  if(!url) return null;
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.json();
}
async function firebasePut(obj){
  const url = firebasePath();
  if(!url) return;
  const res = await fetch(url, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(obj)});
  if(!res.ok) throw new Error('HTTP '+res.status);
}
function normalizeRemoteData(remote){
  if(!remote || typeof remote !== 'object' || Array.isArray(remote)) return remote;
  if(remote.recurring===undefined) remote.recurring = [];
  if(remote.transactions===undefined) remote.transactions = [];
  if(remote.kredite===undefined) remote.kredite = [];
  if(remote.sonstiges===undefined) remote.sonstiges = [];
  return remote;
}
function isValidBudgetData(obj){
  return !!(obj && typeof obj==='object' && !Array.isArray(obj)
    && Array.isArray(obj.recurring) && Array.isArray(obj.transactions)
    && Array.isArray(obj.kredite) && Array.isArray(obj.sonstiges));
}

/* -- Laden -- */
async function loadData(){
  let local = null;
  try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw) local = JSON.parse(raw); }catch(e){}

  if(hasCloudStorage){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      DATA = (res && res.value) ? JSON.parse(res.value) : (local || JSON.parse(JSON.stringify(DEFAULT_DATA)));
    }catch(e){ DATA = local || JSON.parse(JSON.stringify(DEFAULT_DATA)); }
    ensureShape();
    render();
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(DATA), false); }catch(e){}
    return;
  }

  DATA = local || JSON.parse(JSON.stringify(DEFAULT_DATA));
  ensureShape();
  render();

  syncConfig = loadSyncConfig();
  if(syncConfig){
    syncStatus = 'syncing'; render();
    try{
      const remote = normalizeRemoteData(await firebaseGet());
      if(remote && !isValidBudgetData(remote)){
        throw new Error('Ungültige Antwort aus der Cloud-Datenbank (falsche URL oder falscher Schlüssel?)');
      }
      if(remote){
        if(!local || (remote.updatedAt||0) >= (local.updatedAt||0)){ DATA = remote; ensureShape(); }
        else { await firebasePut(DATA); }
      } else {
        DATA.updatedAt = Date.now();
        await firebasePut(DATA);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
      syncStatus = 'connected'; syncErrorMsg='';
    }catch(e){ syncStatus = 'error'; syncErrorMsg = e.message||String(e); console.error('Sync-Fehler', e); }
    render();
    startSyncPolling();
  }
}

/* -- Speichern -- */
async function saveData(){
  DATA.updatedAt = Date.now();
  if(hasCloudStorage){
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(DATA), false); }
    catch(e){ console.error('Speichern (Chat) fehlgeschlagen', e); }
    return;
  }
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){}
  if(syncConfig){
    try{ await firebasePut(DATA); syncStatus='connected'; syncErrorMsg=''; }
    catch(e){ syncStatus='error'; syncErrorMsg = e.message||String(e); console.error('Sync-Fehler beim Speichern', e); }
  }
}

/* -- Hintergrund-Abgleich -- */
function startSyncPolling(){
  if(syncPollTimer) clearInterval(syncPollTimer);
  syncPollTimer = setInterval(pullRemoteIfNewer, 20000);
  if(!startSyncPolling._listenerAdded){
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pullRemoteIfNewer(); });
    startSyncPolling._listenerAdded = true;
  }
}
async function pullRemoteIfNewer(){
  if(!syncConfig || isEditingSomething()) return;
  try{
    const remote = normalizeRemoteData(await firebaseGet());
    if(remote && !isValidBudgetData(remote)){
      throw new Error('Ungültige Antwort aus der Cloud-Datenbank (falsche URL oder falscher Schlüssel?)');
    }
    if(remote && (remote.updatedAt||0) > (DATA.updatedAt||0)){
      DATA = remote; ensureShape();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
      render();
    }
    syncStatus = 'connected'; syncErrorMsg='';
  }catch(e){ syncStatus = 'error'; syncErrorMsg = e.message||String(e); console.error('Sync-Poll-Fehler', e); }
}

/* -- Sync-Formular-Aktionen -- */
function genRandomKey(){
  const chars='abcdefghijkmnopqrstuvwxyz23456789';
  let s='';
  for(let i=0;i<20;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
async function connectSync(){
  const dbUrl = document.getElementById('sync-dburl').value.trim();
  const key = document.getElementById('sync-key').value.trim();
  if(!dbUrl || !key){ syncErrorMsg='Bitte Datenbank-URL und Sync-Schlüssel angeben.'; syncStatus='error'; render(); return; }
  syncConfig = {dbUrl, syncKey:key};
  saveSyncConfigLocal(syncConfig);
  syncStatus = 'syncing'; render();
  try{
    const remote = normalizeRemoteData(await firebaseGet());
    if(remote && !isValidBudgetData(remote)){
      throw new Error('Ungültige Antwort aus der Cloud-Datenbank (falsche URL oder falscher Schlüssel?)');
    }
    if(remote){
      if((remote.updatedAt||0) >= (DATA.updatedAt||0)){ DATA = remote; ensureShape(); }
      else { await firebasePut(DATA); }
    } else {
      DATA.updatedAt = Date.now();
      await firebasePut(DATA);
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
    syncStatus = 'connected'; syncErrorMsg='';
  }catch(e){ syncStatus = 'error'; syncErrorMsg = e.message||String(e); console.error(e); }
  startSyncPolling();
  render();
}
function disconnectSync(){
  clearSyncConfigLocal();
  syncConfig = null; syncStatus = 'none'; syncErrorMsg='';
  if(syncPollTimer){ clearInterval(syncPollTimer); syncPollTimer=null; }
  render();
}
async function manualSyncNow(){
  syncStatus='syncing'; render();
  await pullRemoteIfNewer();
  render();
}
/* ---------- Helpers ---------- */
function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtEUR(n){ n = Number(n)||0; return n.toLocaleString('de-DE',{style:'currency',currency:'EUR'}); }
function parseNum(str){ if(str===null||str===undefined) return 0; const v = parseFloat(String(str).replace(/\./g,'').replace(',','.')); return isNaN(v)?parseFloat(str)||0:v; }
function pad2(n){ return String(n).padStart(2,'0'); }
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
function recurringActiveInMonth(item, month){
  return item.frequency==='monatlich' || (item.months||[]).includes(month);
}
function monthTotals(year, month){
  let inc=0, exp=0;
  DATA.recurring.forEach(r=>{
    if(recurringActiveInMonth(r, month)){
      if(r.type==='einnahme') inc+=r.amount; else exp+=r.amount;
    }
  });
  DATA.transactions.forEach(t=>{
    const d = new Date(t.date+'T00:00:00');
    if(d.getFullYear()===year && (d.getMonth()+1)===month){
      if(t.type==='einnahme') inc+=t.amount; else exp+=t.amount;
    }
  });
  return {inc,exp};
}
function paidKey(recId, year, month){ return recId+'_'+year+'_'+month; }
function defaultFixDate(r, year, month){ return `${year}-${pad2(month)}-${pad2(r.day||1)}`; }
function effectiveFixDate(r, year, month){
  const k = paidKey(r.id, year, month);
  return DATA.dateOverrides[k] || defaultFixDate(r, year, month);
}
function toggleFixPaid(recId, year, month){
  const k = paidKey(recId, year, month);
  if(DATA.paidMarks[k]) delete DATA.paidMarks[k]; else DATA.paidMarks[k] = true;
  saveData(); render();
}
function toggleTxnPaid(id){
  const t = DATA.transactions.find(x=>x.id===id);
  if(!t) return;
  t.paid = !t.paid;
  saveData(); render();
}
function setFixDate(recId, year, month, newDate){
  if(!newDate) return;
  const k = paidKey(recId, year, month);
  const r = DATA.recurring.find(x=>x.id===recId);
  if(r && newDate === defaultFixDate(r, year, month)){ delete DATA.dateOverrides[k]; }
  else { DATA.dateOverrides[k] = newDate; }
  saveData(); render();
}
/* Datum-Zelle für die Fixkosten-Vorlagen: bezieht sich auf den in state.selYear/selMonth
   gewählten Monat (gleiche Auswahl wie in der Übersicht). Immer editierbar — auch bei
   periodischen Posten (Oederquart/Nindorf) in einem Monat, in dem sie nicht fällig sind. */
function fixDateCell(r){
  const d = effectiveFixDate(r, state.selYear, state.selMonth);
  return `<input type="date" class="date-in" value="${d}" onchange="setFixDate('${r.id}', ${state.selYear}, ${state.selMonth}, this.value)">`;
}
function typeBadge(type){
  return `<span class="badge ${type==='einnahme'?'in':'out'}">${type==='einnahme'?'Einnahme':'Ausgabe'}</span>`;
}
/* ---------- Zahlungsart / Beschreibung (frei eintragbar, mit Vorschlägen) ---------- */
function setFixPaymentMethod(recId, value){
  const r = DATA.recurring.find(x=>x.id===recId);
  if(!r) return;
  r.paymentMethod = value;
  saveData(); render();
}
function setTxnPaymentMethod(id, value){
  const t = DATA.transactions.find(x=>x.id===id);
  if(!t) return;
  t.paymentMethod = value;
  saveData(); render();
}
function paymentMethodClass(type, value){
  const v = (value||'').trim();
  if(!v) return 'pm-none';
  if(type==='einnahme') return 'pm-green';
  const lv = v.toLowerCase();
  if(lv==='lastschrift') return 'pm-red';
  if(lv==='dauerauftrag') return 'pm-blue';
  if(lv==='überweisung' || lv==='ueberweisung') return 'pm-gold';
  return 'pm-custom';
}
function pmBucket(value){
  const v = (value||'').trim().toLowerCase();
  if(v==='lastschrift') return 'Lastschrift';
  if(v==='dauerauftrag') return 'Dauerauftrag';
  if(v==='überweisung' || v==='ueberweisung') return 'Überweisung';
  return 'Sonstige';
}
function paymentMethodInput(kind, id, type, value){
  const listId = type==='einnahme' ? 'pm-list-income' : 'pm-list-expense';
  const cls = paymentMethodClass(type, value);

  return `<input type="text" class="pm-input ${cls}" list="${listId}" value="${esc(value||'')}" placeholder="– eintragen –" onchange="${handler}">`;
}
function allCategories(){
  const set = new Set();
  DATA.recurring.forEach(r=>set.add(r.category));
  DATA.transactions.forEach(t=>set.add(t.category));

function svgChart(incomeArr, expenseArr, highlightIdx){
  const w=740,h=230,padL=44,padR=8,padT=14,padB=26;
  const chartW=w-padL-padR, chartH=h-padT-padB;
  const max = Math.max(1, ...incomeArr, ...expenseArr)*1.15;
  const groupW = chartW/12;
  const barW = groupW*0.32;
  let bars='', grid='';
  for(let g=0; g<=4; g++){
    const gy = padT + chartH - (chartH*g/4);
    grid += `<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" class="chart-grid"/>`;
    grid += `<text x="${padL-6}" y="${gy+3}" text-anchor="end" class="chart-axis">${Math.round(max*g/4)}</text>`;
  }
  for(let i=0;i<12;i++){
    const gx = padL + i*groupW;
    const incH = (incomeArr[i]/max)*chartH;
    const expH = (expenseArr[i]/max)*chartH;
    const incX = gx + groupW*0.14;
    const expX = incX + barW + 3;
    const highlight = i===highlightIdx;
    bars += `<rect x="${incX}" y="${padT+chartH-incH}" width="${barW}" height="${incH}" rx="2" fill="var(--income)" opacity="${highlight?1:0.7}"/>`;
    bars += `<rect x="${expX}" y="${padT+chartH-expH}" width="${barW}" height="${expH}" rx="2" fill="var(--expense)" opacity="${highlight?1:0.7}"/>`;
    bars += `<text x="${gx+groupW/2}" y="${h-8}" text-anchor="middle" class="chart-label" ${highlight?'font-weight="700" fill="var(--ink)"':''}>${MONTH_ABBR[i]}</text>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg">${grid}${bars}</svg>`;
}

function submitTxn(){
  const date = document.getElementById('f-date').value;

  const description = document.getElementById('f-desc').value.trim();

  const amount = Math.abs(parseNum(document.getElementById('f-amt').value));
  if(!date || !category || !amount){ return; }

    state.editTxnId = null;
  } else {
    DATA.transactions.push({id:uid('txn'), date, type, category, description, paymentMethod, amount});
  }
  saveData(); render();
}

function onRecDragLeave(ev){

function onRecDropRow(ev, targetId){

      <li>Oben auf der Datenbank-Seite die angezeigte <strong>Datenbank-URL</strong> kopieren (endet auf „…firebasedatabase.app" oder „…firebaseio.com") und oben in das Feld einfügen.</li>
      <li>Einen <strong>Sync-Schlüssel</strong> erzeugen lassen (Knopf oben) und <strong>notieren</strong> — er ersetzt ein Passwort, da die Datenbank offen ist.</li>
      <li>Auf dem zweiten Gerät (Handy) exakt <strong>dieselbe</strong> Datenbank-URL und denselben Sync-Schlüssel eintragen und verbinden.</li>
    </ol>
    <p class="section-desc" style="margin-top:10px;">Hinweis: Mit „Testmodus"-Regeln kann grundsätzlich jeder mit der genauen URL und dem Schlüssel auf die Daten zugreifen. Für ein rein privates Haushaltsbuch ist das in Ordnung, solange der Schlüssel geheim bleibt — teile ihn nicht öffentlich.</p>
  `;
}
/* ---------- Reset ---------- */
async function doReset(){
  DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
  state.resetConfirm = false;
  await saveData();
  render();
}
function afterRenderHooks(){}
loadData();
</script>
